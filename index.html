<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chat-widget</title>
  </head>
  <body>
    <div id="chat-widget-root"></div>
    <template id="chat-widget-template">
      <div class="w-80 max-h-[100vh] bg-white shadow-2xl rounded-xl border border-gray-200 overflow-hidden flex flex-col">
        <div class="bg-red-600 text-white px-4 py-2 flex items-center justify-between">
          <span class="font-semibold">AIMAQ</span>
          <div class="flex items-center space-x-2">
            <button class="p-1 rounded hover:bg-red-700 transition">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z" />
              </svg>
            </button>
            <button class="p-1 rounded hover:bg-red-700 transition" id="fullscreenBtn">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
              </svg>
            </button>
          </div>
        </div>
        <div id="messages" class="h-64 overflow-y-auto p-3 space-y-2"></div>
        <div class="p-3 border-t flex items-center">
          <input
            id="chatInput"
            class="flex-1 border rounded-lg px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"
            placeholder="Напишите свой запрос..."
          />
          <button id="sendBtn" class="ml-2 text-white bg-red-500 p-2 transition rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-5">
              <path fill-rule="evenodd" d="M10 17a.75.75 0 0 1-.75-.75V5.612L5.29 9.77a.75.75 0 0 1-1.08-1.04l5.25-5.5a.75.75 0 0 1 1.08 0l5.25 5.5a.75.75 0 1 1-1.08 1.04l-3.96-4.158V16.25A.75.75 0 0 1 10 17Z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>
    </template>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
